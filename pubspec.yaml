name: flutter_tutorial
description: "Flutter e-commerce client for the spring-boot-tutorial backend."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management and DI
  flutter_riverpod: ^2.5.1
  hooks_riverpod: ^2.5.1
  flutter_hooks: ^0.20.5
  riverpod_annotation: ^2.4.0

  # Navigation
  go_router: ^14.6.3

  # HTTP
  dio: ^5.11.1
  pretty_dio_logger: ^1.4.0

  # Models / serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Local database
  sqflite: ^2.4.3
  path_provider: ^2.1.6
  path: ^1.9.1

  # Secure storage
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

  # Code generation
  riverpod_generator: ^2.4.0
  riverpod_lint: ^2.4.0
  custom_lint: ^0.7.3
  freezed: ^3.1.0
  json_serializable: ^6.9.0
  build_runner: ^2.4.13

  # Testing
  sqflite_common_ffi: ^2.3.4+4

flutter:
  uses-material-design: true
