name: flutter_tutorial
description: "Flutter e-commerce client for the spring-boot-tutorial backend."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0
  material_ui: ^1.1.0

  # State management and DI
  flutter_riverpod: ^3.5.0
  hooks_riverpod: ^3.5.0
  flutter_hooks: ^0.21.4
  riverpod_annotation: ^4.0.8

  # Navigation
  go_router: ^18.1.4

  # HTTP
  dio: ^5.11.1
  pretty_dio_logger: ^1.4.0

  # Models / serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Local database
  sqflite: ^2.4.3
  path_provider: ^2.1.6
  path: ^1.9.1

  # Secure storage
  flutter_secure_storage: ^11.2.0

  # Utilities
  fpdart: ^1.1.0
  flutter_dotenv: ^6.0.2
  intl: ^0.20.3
  flutter_localizations:
    sdk: flutter
  connectivity_plus: ^7.3.2
  cached_network_image: ^4.0.7
  timeago: ^3.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation
  riverpod_generator: ^4.0.10
  freezed: ^4.0.3
  json_serializable: ^6.9.0
  build_runner: ^2.17.1

  # Testing
  mocktail: ^1.0.4
  sqflite_common_ffi: ^2.3.4+4
  http_mock_adapter: ^0.6.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - .env.development
    - .env.production
    - .env.web
