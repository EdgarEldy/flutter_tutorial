name: CI

on:
  pull_request:
    branches:
      - master

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    if: github.head_ref == 'develop'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
